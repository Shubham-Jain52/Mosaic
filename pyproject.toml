[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-cli"
version = "0.3.2"
description = "Local-first BYOK CLI: index GitHub PR review history and run mosaic check for cited, advisory feedback."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "certifi==2026.5.20",
    "charset-normalizer==3.4.7",
    "chromadb==0.5.23",
    "idna==3.16",
    "openai==1.82.0",
    "python-dotenv==1.1.1",
    "requests==2.32.5",
    "SQLAlchemy==2.0.41",
    "typer==0.16.0",
    "typing_extensions==4.16.0",
    "urllib3==2.6.3",
]

[project.optional-dependencies]
local = [
    "fastembed==0.7.1",
]

[project.scripts]
mosaic = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "scrapers*", "pipeline*", "ai*", "api*", "automation*"]
